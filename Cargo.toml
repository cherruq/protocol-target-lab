[package]
name = "protocol-target-lab"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[[bin]]
name = "protocol-target-lab"
path = "backend/src/main.rs"

[dependencies]
axum = "=0.8.9"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
fs2 = "0.4"
sha2 = "0.10"
include_dir = "0.7"
mime_guess = "2"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
anyhow = "1"

[profile.release]
strip = true
lto = "thin"
